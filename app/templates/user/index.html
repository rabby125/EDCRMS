{% extends "layout/base.html" %}
{% block title %}Users - EDCRMS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3>Users</h3>
  <button class="btn btn-primary" id="addNewBtn" data-bs-toggle="modal" data-bs-target="#addModal"><i class="fa-solid fa-plus"></i> Add New</button>
</div>

<div class="card p-3">
  <input type="text" id="search-box" class="form-control mb-3" placeholder="Search by name or username...">
  <div class="table-responsive">
    <table class="table table-hover">
      <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
      <tbody id="data-tbody"></tbody>
    </table>
  </div>
</div>

<!-- Add Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Add User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="form-error" class="alert alert-danger d-none"></div>
        <form id="add-form">
          <div class="mb-2"><label class="form-label">Name</label><input type="text" class="form-control" id="f_name" required></div>
          <div class="mb-2"><label class="form-label">Username</label><input type="text" class="form-control" id="f_username" required autocomplete="off"></div>
          <div class="mb-2"><label class="form-label">Password</label><input type="password" class="form-control" id="f_password" required></div>
          <div class="mb-2"><label class="form-label">Role</label>
            <select class="form-select" id="f_role_id" required></select>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-2">Save</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Edit User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="edit-form-error" class="alert alert-danger d-none"></div>
        <form id="edit-form">
          <input type="hidden" id="e_id">
          <div class="mb-2"><label class="form-label">Name</label><input type="text" class="form-control" id="e_name" required></div>
          <div class="mb-2"><label class="form-label">Role</label>
            <select class="form-select" id="e_role_id" required></select>
          </div>
          <div class="mb-2"><label class="form-label">Status</label>
            <select class="form-select" id="e_status">
              <option value="active">active</option>
              <option value="inactive">inactive</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-2">Update</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
requireAuth();
const API = "/api/users/";
const ROLE_API = "/api/roles/";
const myRole = localStorage.getItem('edcrms_role');
const canDeleteUser = myRole === 'Super Admin';

if (!canAtLeast('Admin')) {
  const addBtn = document.getElementById('addNewBtn');
  if (addBtn) addBtn.style.display = 'none';
}

let rolesCache = [];       // all roles that exist, used for showing names / checking levels
let assignableRoles = [];  // subset current user is allowed to assign in the dropdowns

async function loadRoles() {
  rolesCache = await apiGet(ROLE_API);
  // Only Super Admin can assign Admin/Super Admin. Everyone else only
  // sees roles strictly below their own in the assignment dropdowns.
  assignableRoles = (myRole === 'Super Admin')
    ? rolesCache
    : rolesCache.filter(r => (ROLE_LEVELS[r.name] || 0) < (ROLE_LEVELS[myRole] || 0));
  const options = assignableRoles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
  document.getElementById('f_role_id').innerHTML = options;
  document.getElementById('e_role_id').innerHTML = options;
}

function roleName(role_id) {
  const r = rolesCache.find(r => r.id === role_id);
  return r ? r.name : '-';
}

function canManageUser(role_id) {
  if (myRole === 'Super Admin') return true;
  const r = rolesCache.find(r => r.id === role_id);
  const targetLevel = r ? (ROLE_LEVELS[r.name] || 0) : 0;
  return targetLevel < (ROLE_LEVELS[myRole] || 0);
}

async function loadData(search) {
  const rows = await apiGet(API);
  const filtered = search
    ? rows.filter(r => (r.name || '').toLowerCase().includes(search.toLowerCase()) || (r.username || '').toLowerCase().includes(search.toLowerCase()))
    : rows;

  document.getElementById('data-tbody').innerHTML = filtered.map(r => `
    <tr>
      <td>${r.name ?? '-'}</td>
      <td>${r.username ?? '-'}</td>
      <td>${roleName(r.role_id)}</td>
      <td>${r.status ?? '-'}</td>
      <td>
        ${canManageUser(r.role_id) ? `<button class="btn btn-sm btn-outline-primary me-1" onclick='openEdit(${JSON.stringify(r)})'><i class="fa-solid fa-pen"></i></button>` : ''}
        ${canDeleteUser ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${r.id})"><i class="fa-solid fa-trash"></i></button>` : ''}
      </td>
    </tr>
  `).join('') || '<tr><td colspan="5" class="text-muted text-center">No records found</td></tr>';
}

document.getElementById('search-box').addEventListener('input', (e) => loadData(e.target.value));

document.getElementById('add-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('form-error');
  errBox.classList.add('d-none');
  const payload = {
    name: document.getElementById("f_name").value,
    username: document.getElementById("f_username").value,
    password: document.getElementById("f_password").value,
    role_id: parseInt(document.getElementById("f_role_id").value),
  };
  try {
    await apiSend(API, 'POST', payload);
    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
    document.getElementById('add-form').reset();
    loadData();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.remove('d-none');
  }
});

function openEdit(user) {
  document.getElementById('e_id').value = user.id;
  document.getElementById('e_name').value = user.name;
  document.getElementById('e_role_id').value = user.role_id;
  document.getElementById('e_status').value = user.status || 'active';
  new bootstrap.Modal(document.getElementById('editModal')).show();
}

document.getElementById('edit-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('edit-form-error');
  errBox.classList.add('d-none');
  const id = document.getElementById('e_id').value;
  const payload = {
    name: document.getElementById("e_name").value,
    role_id: parseInt(document.getElementById("e_role_id").value),
    status: document.getElementById("e_status").value,
  };
  try {
    await apiSend(`${API}${id}`, 'PUT', payload);
    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    loadData();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.remove('d-none');
  }
});

async function deleteItem(id) {
  if (!confirm('Delete this user?')) return;
  try {
    await apiSend(`${API}${id}`, 'DELETE');
    loadData();
  } catch (err) {
    alert(err.message);
  }
}

(async function init() {
  await loadRoles();
  await loadData();
})();
</script>
{% endblock %}
