<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - EDCRMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="login-body d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow login-card p-4" style="width: 380px;">
    <h4 class="text-center mb-1"><i class="fa-solid fa-server"></i> EDCRMS</h4>
    <p class="text-center text-muted mb-4">Enterprise Data Center Rack Management</p>
    <div id="error-box" class="alert alert-danger d-none"></div>
    <form id="login-form">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required placeholder="Enter username" autocomplete="off">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required placeholder="••••••••" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('error-box');
  errorBox.classList.add('d-none');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');

    localStorage.setItem('edcrms_token', data.access_token);
    localStorage.setItem('edcrms_user', data.user_name);
    localStorage.setItem('edcrms_role', data.role || '');
    window.location.href = '/dashboard';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove('d-none');
  }
});
</script>
</body>
</html>
