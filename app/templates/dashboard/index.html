{% extends "layout/base.html" %}
{% block title %}Dashboard - EDCRMS{% endblock %}
{% block content %}
<h3 class="mb-4">Dashboard</h3>

<div class="card p-3 mb-4">
  <div class="input-group">
    <input type="text" id="dashboard-search" class="form-control" placeholder="Search device by hostname...">
    <button class="btn btn-primary" id="dashboard-search-btn" type="button"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
  </div>
  <div id="dashboard-search-results" class="mt-3 d-none">
    <div class="table-responsive">
      <table class="table table-sm table-hover mb-0">
        <thead><tr><th>Hostname</th><th>IP Address</th><th>Rack</th><th>Status</th></tr></thead>
        <tbody id="dashboard-search-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="row g-3" id="summary-cards"></div>

<div class="row mt-4 g-3">
  <div class="col-md-6">
    <div class="card p-3">
      <h6>Device Status</h6>
      <canvas id="deviceStatusChart" height="200"></canvas>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card p-3">
      <h6>Recent Activities</h6>
      <ul class="list-group list-group-flush" id="recent-activities"></ul>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
requireAuth();

async function runDashboardSearch() {
  const q = document.getElementById('dashboard-search').value.trim();
  const resultsBox = document.getElementById('dashboard-search-results');
  const tbody = document.getElementById('dashboard-search-tbody');
  if (!q) {
    resultsBox.classList.add('d-none');
    return;
  }
  const devices = await apiGet('/api/devices/?search=' + encodeURIComponent(q));
  resultsBox.classList.remove('d-none');
  tbody.innerHTML = devices.map(d => `
    <tr>
      <td>${d.hostname}</td>
      <td>${d.ip_address || '-'}</td>
      <td>#${d.rack_id}</td>
      <td><span class="badge bg-${d.status === 'online' ? 'success' : d.status === 'offline' ? 'danger' : 'warning'}">${d.status}</span></td>
    </tr>
  `).join('') || '<tr><td colspan="4" class="text-muted text-center">No matching devices found</td></tr>';
}

document.getElementById('dashboard-search-btn').addEventListener('click', runDashboardSearch);
document.getElementById('dashboard-search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    runDashboardSearch();
  }
});

async function loadDashboard() {
  const summary = await apiGet('/api/dashboard/summary');
  const cardDefs = [
    ['Data Centers', summary.total_data_centers, 'fa-building'],
    ['Rooms', summary.total_rooms, 'fa-door-open'],
    ['Racks', summary.total_racks, 'fa-server'],
    ['Devices', summary.total_devices, 'fa-hard-drive'],
    ['Online', summary.online_devices, 'fa-circle-check text-success'],
    ['Offline', summary.offline_devices, 'fa-circle-xmark text-danger'],
    ['Rack Usage %', summary.rack_usage_percent + '%', 'fa-chart-pie'],
    ['Free Space (U)', summary.free_rack_space_u, 'fa-cube'],
    ['Warranty Alerts', summary.warranty_expiring_soon, 'fa-triangle-exclamation text-warning'],
    ['Active Users', summary.active_users, 'fa-users'],
    ['Critical Alerts', summary.system_critical_alerts, 'fa-bell text-danger'],
  ];

  const container = document.getElementById('summary-cards');
  container.innerHTML = cardDefs.map(([label, value, icon]) => `
    <div class="col-md-3 col-sm-6">
      <div class="card p-3 stat-card">
        <i class="fa-solid ${icon} fa-lg mb-2"></i>
        <div class="fs-4 fw-bold">${value}</div>
        <div class="text-muted small">${label}</div>
      </div>
    </div>
  `).join('');

  const chartData = await apiGet('/api/dashboard/device-status-chart');
  new Chart(document.getElementById('deviceStatusChart'), {
    type: 'doughnut',
    data: {
      labels: chartData.labels,
      datasets: [{ data: chartData.values, backgroundColor: ['#198754', '#dc3545', '#ffc107', '#0d6efd'] }]
    }
  });

  const activities = await apiGet('/api/dashboard/recent-activities?limit=8');
  document.getElementById('recent-activities').innerHTML = activities.map(a => `
    <li class="list-group-item small">
      <strong>${a.module}</strong> — ${a.action} <span class="text-muted">(${new Date(a.created_at).toLocaleString()})</span>
    </li>
  `).join('') || '<li class="list-group-item small text-muted">No recent activity</li>';
}

loadDashboard();
</script>
{% endblock %}
